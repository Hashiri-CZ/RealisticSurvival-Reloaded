ConfigId: "1.3.2-RELEASE"

BodyHealth:
  HUD:
    # X anchor relative to the bossbar canvas center. Range [-200, +200].
    # Positive = right side. The body silhouette is 32 px wide and is bottom-
    # anchored to the screen by the rendertype_text shader (Bucket E,
    # ascent -14500 → top = ui.y - 76, bottom = ui.y - 12), so vertical
    # position is fixed regardless of GUI scale. Default 184 keeps the
    # silhouette tight against the right side of the bossbar canvas, ~16 px
    # past its right edge but still inside the player's viewport on any
    # reasonable aspect ratio. Use lower values (e.g. 152, 168) to pull it
    # back toward screen center.
    AnchorX: 184

    # Render task period in ticks. 5 ticks = 4Hz refresh.
    TickPeriod: 5
