# Harshlands — Disease module settings.
Initialize:
  Enabled: true
Shutdown:
  Enabled: true

# Ticks between progression checks (also the effect re-apply cadence).
CheckIntervalTicks: 60

Diseases:
  respiratory_infection:
    Enabled: true
    DisplayName: "Respiratory Infection"
    IncubationTicks: 1200          # 60s before stage 1
    Immunity:
      DurationTicks: 0             # no immunity after cure
    Cure:
      ItemId: cold_remedy
    Mitigation:
      Type: TAN_WARM_DRY
      TemperatureAtLeast: 12.0     # TAN temperature units; tune to your TAN scale
    Stages:
      - DurationTicks: 2400        # stage 1: 2 min untreated -> stage 2
        Symptoms:
          - Handler: PlaySound
            Params: { Sound: ENTITY_PLAYER_HURT, Volume: 0.5, Pitch: 1.3 }
      - DurationTicks: 2400        # stage 2 -> stage 3
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: SLOWNESS, Amplifier: 0, DurationTicks: 100 }
          - Handler: PotionEffect
            Params: { Effect: MINING_FATIGUE, Amplifier: 0, DurationTicks: 100 }
      - DurationTicks: 0           # stage 3: terminal
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 100 }
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  endersion:
    Enabled: true
    DisplayName: "Endersion"
    IncubationTicks: 1200
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: stabilizing_tonic
    Mitigation:
      Type: NO_EXPOSURE
    Stages:
      - DurationTicks: 2400        # stage 1: occasional item-use failure
        Symptoms:
          - Handler: ItemUseFailure
            Params: { Chance: 0.15 }
      - DurationTicks: 2400        # stage 2: frequent failure + nausea
        Symptoms:
          - Handler: ItemUseFailure
            Params: { Chance: 0.40 }
          - Handler: PotionEffect
            Params: { Effect: NAUSEA, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: random teleports + failure (non-lethal)
        Symptoms:
          - Handler: ItemUseFailure
            Params: { Chance: 0.40 }
          - Handler: RandomTeleport
            Params: { Chance: 0.20, MaxRadius: 6 }

  crimson:
    Enabled: true
    DisplayName: "Crimson"
    IncubationTicks: 1200
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: anti_rad_tablets
    Mitigation:
      Type: NO_EXPOSURE
    Stages:
      - DurationTicks: 2400        # stage 1: nausea
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: NAUSEA, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 2400        # stage 2: blocks natural regen
        Symptoms:
          - Handler: BlockNaturalRegen
            Params: {}
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: withering DoT (lethal-if-ignored)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WITHER, Amplifier: 0, DurationTicks: 120 }
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  septicemia:
    Enabled: true
    DisplayName: "Septicemia"
    IncubationTicks: 600           # 30s before stage 1 (acute onset)
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: antibiotics          # Mode omitted -> CLEAR (single-dose)
    Stages:
      - DurationTicks: 2400        # stage 1: nausea
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: NAUSEA, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 2400        # stage 2: poison pulses
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: POISON, Amplifier: 0, DurationTicks: 100 }
      - DurationTicks: 0           # stage 3: strong poison + lethal DoT
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: POISON, Amplifier: 1, DurationTicks: 100 }
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  wasting_blight:
    Enabled: true
    DisplayName: "Wasting Blight"
    IncubationTicks: 2400          # 2 min (insidious onset)
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: antiviral_regimen
      Mode: REGRESS_ONE_STAGE
      DoseCooldownTicks: 1200      # 60s between effective doses
    Stages:
      - DurationTicks: 4800        # stage 1: fatigue
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: MINING_FATIGUE, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 4800        # stage 2: immune suppression + weakness
        Symptoms:
          - Handler: ImmuneSuppression
            Params: { Multiplier: 1.5 }
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: severe suppression + strong weakness (indirect lethality)
        Symptoms:
          - Handler: ImmuneSuppression
            Params: { Multiplier: 2.0 }
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 1, DurationTicks: 120 }

  festering_wound:
    Enabled: true
    DisplayName: "Festering Wound"
    IncubationTicks: 1200          # 60s before stage 1
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: disinfectant_bandage # Mode omitted -> CLEAR
    Mitigation:
      Type: INJURY_HEAL
      InjuredStates: [DAMAGED, BROKEN]   # MUST match Triggers.Injury.LimbInjury.InjuredStates
    Stages:
      - DurationTicks: 2400        # stage 1: inflammation (mild slowness)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: SLOWNESS, Amplifier: 0, DurationTicks: 100 }
      - DurationTicks: 2400        # stage 2: infection (poison + mobility loss)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: POISON, Amplifier: 0, DurationTicks: 100 }
          - Handler: PotionEffect
            Params: { Effect: SLOWNESS, Amplifier: 0, DurationTicks: 100 }
      - DurationTicks: 0           # stage 3: sepsis (strong poison + lethal DoT)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: POISON, Amplifier: 1, DurationTicks: 100 }
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  tetanus:
    Enabled: true
    DisplayName: "Tetanus"
    IncubationTicks: 1200
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: antitoxin            # Mode omitted -> CLEAR; balanced as time-sensitive
    Stages:
      - DurationTicks: 2400        # stage 1: stiffness (intermittent slowness)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: SLOWNESS, Amplifier: 0, DurationTicks: 100 }
      - DurationTicks: 2400        # stage 2: locked jaw (cannot eat)
        Symptoms:
          - Handler: BlockEating
            Params: { Chance: 1.0 }
      - DurationTicks: 0           # stage 3: convulsions (weakness + lethal DoT)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 100 }
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  malnutrition:
    Enabled: true
    DisplayName: "Malnutrition"
    IncubationTicks: 2400          # 2 min before stage 1
    Immunity:
      DurationTicks: 0
    # No cure item — recovered only by eating a balanced diet (DIET mitigation).
    Mitigation:
      Type: DIET
      MalnourishedTiers: [STARVING, SEVERELY_MALNOURISHED, MALNOURISHED]  # MUST match Triggers.Diet.MalnourishedTiers
    Stages:
      - DurationTicks: 4800        # stage 1: no natural regen
        Symptoms:
          - Handler: BlockNaturalRegen
            Params: {}
      - DurationTicks: 4800        # stage 2: reduced max hearts
        Symptoms:
          - Handler: MaxHealthReduction
            Params: { Hearts: 4 }
      - DurationTicks: 0           # stage 3: weakness + fainting (brief blindness)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
          - Handler: PotionEffect
            Params: { Effect: BLINDNESS, Amplifier: 0, DurationTicks: 60 }

  dysentery:
    Enabled: true
    DisplayName: "Dysentery"
    IncubationTicks: 600           # 30s before stage 1 (acute onset)
    Immunity:
      DurationTicks: 0
    Cure:
      ItemId: rehydration_salts    # Mode omitted -> CLEAR
    # NO_EXPOSURE wraps UnpurifiedWaterTrigger: stop drinking raw water -> regress.
    # Safe with this event-driven trigger: the progression task calls contraction (totalChance)
    # only when uninfected and the mitigation check only when infected — they never run on the
    # same tick, so the trigger's one-shot pending is never double-consumed.
    Mitigation:
      Type: NO_EXPOSURE
    Stages:
      - DurationTicks: 2400        # stage 1: cramps (hunger drain)
        Symptoms:
          - Handler: HungerDrain
            Params: { Amount: 1 }
      - DurationTicks: 2400        # stage 2: frequent hunger loss + nausea
        Symptoms:
          - Handler: HungerDrain
            Params: { Amount: 2 }
          - Handler: PotionEffect
            Params: { Effect: NAUSEA, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: dehydration DoT
        Symptoms:
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

  battle_trauma:
    Enabled: true
    DisplayName: "Battle Trauma"
    IncubationTicks: 600           # 30s before stage 1
    Immunity:
      DurationTicks: 0
    # No cure item — fades on its own once deaths stop (NO_EXPOSURE regress).
    Mitigation:
      Type: NO_EXPOSURE
    Stages:
      - DurationTicks: 4800        # stage 1: jitters (occasional nausea)
        Symptoms:
          - Handler: Jitters
            Params: { Chance: 0.3, DurationTicks: 60 }
      - DurationTicks: 4800        # stage 2: attack penalty (weakness); Fear cross-link in Plan 4
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: panic (weakness + mining fatigue)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
          - Handler: PotionEffect
            Params: { Effect: MINING_FATIGUE, Amplifier: 0, DurationTicks: 120 }

  sybok:
    Enabled: true
    DisplayName: "Sybok"
    IncubationTicks: 2400          # 2 min latent before stage 1
    Immunity:
      DurationTicks: 24000         # 20 min post-cure reprieve (the experimental treatment buys time)
    Cure:
      ItemId: experimental_treatment
      Mode: CLEAR_BEFORE_TERMINAL  # only curable before the terminal stage
    Stages:
      - DurationTicks: 9600        # stage 1: latent (no symptoms, slow growth)
        Symptoms: []
      - DurationTicks: 9600        # stage 2: pain (intermittent weakness)
        Symptoms:
          - Handler: PotionEffect
            Params: { Effect: WEAKNESS, Amplifier: 0, DurationTicks: 120 }
      - DurationTicks: 0           # stage 3: chronic lethality (slow unavoidable DoT)
        Symptoms:
          - Handler: DamageOverTime
            Params: { Amount: 1.0 }

Triggers:
  ColdExposure:
    Disease: respiratory_infection
    TemperatureBelow: 4.0          # TAN temperature units
    RequireWet: true
    ChancePerCheck: 0.02
  EnderExposure:
    Disease: endersion
    EnderItems:
      - ENDER_PEARL
      - ENDER_EYE
      - ENDER_CHEST
    TheEndCounts: true
    ChancePerCheck: 0.02
  Radiation:
    Disease: crimson
    RadioactiveBlocks:
      - MAGMA_BLOCK
      - SCULK
      - SCULK_CATALYST
    ScanRadius: 2
    ChancePerCheck: 0.02
  InfectedItem:
    Septicemia:
      Disease: septicemia
      InfectedMaterials:
        - ROTTEN_FLESH
        - PUFFERFISH
        - POISONOUS_POTATO
        - SPIDER_EYE
        - CHICKEN              # raw chicken
      ChancePerCheck: 0.35
    WastingBlight:
      Disease: wasting_blight
      RequireDiseasedTag: true
      ChancePerCheck: 0.25
  Injury:
    LimbInjury:
      Disease: festering_wound
      InjuredStates: [DAMAGED, BROKEN]   # MUST match festering_wound Mitigation.InjuredStates
      ChancePerCheck: 0.03
    RustySource:
      Disease: tetanus
      RustyCauses:                       # org.bukkit EntityDamageEvent.DamageCause names
        - CONTACT                        # cactus / sweet-berry bush / pointed dripstone
      RustyMaterials:                    # damaging block, or damager's held item
        - IRON_BARS
        - IRON_DOOR
        - IRON_TRAPDOOR
        - ANVIL
        - CHIPPED_ANVIL
        - DAMAGED_ANVIL
      ChancePerCheck: 0.10            # placeholder; incidental-contact source — final tuning in Plan 4 balance pass
  Diet:
    Disease: malnutrition
    MalnourishedTiers: [STARVING, SEVERELY_MALNOURISHED, MALNOURISHED]  # MUST match malnutrition Mitigation.MalnourishedTiers
    SustainChecks: 5               # consecutive malnourished checks before contraction risk
    ChancePerCheck: 0.05
  UnpurifiedWater:
    Disease: dysentery
    ChancePerCheck: 0.25           # rolled once per check after a raw-water drink
  DeathFrequency:
    Disease: battle_trauma
    DeathThreshold: 3              # deaths within the window to risk Battle Trauma
    WindowTicks: 6000              # 5 min rolling window (converted to wall-clock ms)
    ChancePerCheck: 0.5
  Sybok:
    Disease: sybok
    ThresholdCount: 8              # cumulative disease contractions before Sybok risk
    ChancePerCheck: 0.05
